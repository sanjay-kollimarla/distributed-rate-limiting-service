services:
  redis:
    image: redis:7-alpine
    # Host port 6380 avoids clashing with a Redis already bound to 6379 (e.g. WSL).
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    profiles: ["app"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      API_KEYS: ${API_KEYS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DEMO_MODE: "true"
    ports:
      - "3000:3000"
